
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | ShopLite</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="orders-page">
  <header class="orders-header">
    <a href="index.html" class="orders-brand">ShopLite</a>
    <nav>
      <a href="index.html">Continue shopping</a>
      <a href="auth.html" id="orders-auth-link">Account</a>
    </nav>
  </header>

  <main class="orders-main">
    <section class="orders-intro">
      <p class="orders-eyebrow">YOUR ACCOUNT</p>
      <h1>My orders</h1>
      <p>Track your purchases and review your order details.</p>
    </section>

    <p id="orders-message" role="status" aria-live="polite">
      Loading your orders...
    </p>

    <section id="orders-list" class="orders-list" aria-label="Order history"></section>

    <section id="orders-empty" class="orders-empty" hidden>
      <h2>No orders yet</h2>
      <p>When you place an order, it will appear here.</p>
      <a href="index.html" class="checkout-link">Start shopping</a>
    </section>

    <section id="order-details" class="order-details" hidden>
      <button type="button" id="order-details-close">Back to orders</button>
      <div id="order-details-content"></div>
    </section>
  </main>

  <script src="js/auth-state.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
