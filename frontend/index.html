<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <a href="index.html">ShopLite</a>

    <button id="cart-open" type="button">
      Cart <span id="cart-badge">0</span>
    </button>

    <button
      id="menu-toggle"
      aria-label="Toggle menu"
      aria-expanded="false"
    >☰</button>

    <nav id="main-nav">
      <a href="index.html" class="navigation">Home</a>

      <a href="checkout.html" class="navigation">Checkout</a>
      <a href="auth.html" id="auth-link" class="navigation">
        Login / Signup
      </a>
      <span id="user-status"></span>
      <button id="logout-button" type="button" hidden>
        Logout
      </button>
      <a href="#" class="navigation">Contact us</a>
    </nav>
  </header>


<div class="toolbar">
    <input type="search" id="search-input" placeholder="search-product">
    <select id="category-select">
      <option value="all">All categories</option>
    </select>
</div>


  <main class="content">
    <section id="product-grid" class="product-grid">

    </section>
  </main>

  <div id="cart-overlay" class="cart-overlay"></div>
    <aside id="cart-panel" class="cart-panel">
      <button id="cart-close">X close</button>
      <h2>your cart</h2>
        <div id="cart-items"></div>

        <p>Subtotal <span id="cart-subtotal">0</span></p>

        <div id="cart-checkout" hidden>
          <a href="checkout.html" class="checkout-link">
            Proceed to Checkout
          </a>
        </div>
    </aside>


  <script src="js/data.js"></script>
  <script src="js/cart-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
